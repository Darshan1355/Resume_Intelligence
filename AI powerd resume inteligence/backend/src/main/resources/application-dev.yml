server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: careermind-backend
  datasource:
    url: jdbc:h2:file:./data/careermind_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  ml-service:
    url: http://localhost:8000
    timeout-ms: 15000
  upload:
    dir: uploads/resumes

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    com.careermind: DEBUG
