server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: careermind-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:careerminddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: 15000
  upload:
    dir: ${UPLOAD_DIR:uploads/resumes}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    com.careermind: INFO
    org.springframework.security: INFO
