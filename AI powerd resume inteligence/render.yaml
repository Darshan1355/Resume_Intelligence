services:
  # 1. FastAPI Machine Learning & NLP Service
  - type: web
    name: careermind-ml-service
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. Spring Boot Java Backend
  - type: web
    name: careermind-backend
    runtime: image
    image:
      url: eclipse-temurin:17-jre-alpine
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Xms128m -Xmx512m -Dserver.port=$PORT -jar target/careermind-backend-1.0.0.jar
    envVars:
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: careermind-ml-service
          property: host
      - key: JWT_SECRET
        generateValue: true

  # 3. React Frontend (Static Site)
  - type: web
    name: careermind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: careermind-backend
          property: host
