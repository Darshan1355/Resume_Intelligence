version: '3.8'

services:
  # 1. FastAPI Machine Learning Microservice
  ml-service:
    image: ${ACR_SERVER}/careermind-ml-service:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - PORT=8000
    ports:
      - "8000:8000"

  # 2. Spring Boot Java Backend
  backend:
    image: ${ACR_SERVER}/careermind-backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - DB_URL=jdbc:mysql://${AZURE_MYSQL_HOST}:3306/${AZURE_MYSQL_DB:-careermind_db}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=${AZURE_MYSQL_USER}
      - DB_PASSWORD=${AZURE_MYSQL_PASSWORD}
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      - DB_DIALECT=org.hibernate.dialect.MySQLDialect
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - ml-service

  # 3. React Frontend with Nginx Reverse Proxy
  frontend:
    image: ${ACR_SERVER}/careermind-frontend:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
