version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: careermind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: careermind_db
      MYSQL_USER: careermind
      MYSQL_PASSWORD: careermindpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    networks:
      - careermind-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: careermind-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - careermind-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careermind-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/careermind_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=careermind
      - DB_PASSWORD=careermindpass
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      - DB_DIALECT=org.hibernate.dialect.MySQLDialect
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - careermind-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careermind-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - careermind-net

networks:
  careermind-net:
    driver: bridge

volumes:
  mysql_data:
